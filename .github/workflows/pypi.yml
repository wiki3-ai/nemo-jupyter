name: Publish Python packages to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-nmo-python:
    name: Build nmo-python (${{ matrix.target }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # aarch64-unknown-linux-gnu intentionally omitted for now;
          # current upstream build fails in aws-lc-sys on this target.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out nemo sources for nmo-python
        uses: actions/checkout@v4
        with:
          repository: wiki3-ai/nemo
          path: nemo-upstream

      - name: Build wheels with maturin
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --locked --manifest-path nemo-upstream/nemo-python/Cargo.toml --out dist --find-interpreter
          manylinux: auto

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nmo-python-${{ matrix.target }}
          path: dist/*.whl

  publish-nmo-python:
    name: Publish nmo-python to PyPI
    needs: build-nmo-python
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nmo-python-*
          path: dist
          merge-multiple: true

      - name: Publish nmo-python wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  build-nemo-jupyter:
    name: Build nemo-jupyter package
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build .

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nemo-jupyter-dist
          path: dist/*

  publish-nemo-jupyter:
    name: Publish nemo-jupyter to PyPI
    needs: [publish-nmo-python, build-nemo-jupyter]
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download nemo-jupyter artifacts
        uses: actions/download-artifact@v4
        with:
          name: nemo-jupyter-dist
          path: dist

      - name: Publish nemo-jupyter to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
