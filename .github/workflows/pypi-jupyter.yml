name: Publish nemo-jupyter to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-nemo-jupyter:
    name: Build nemo-jupyter package
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build .

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nemo-jupyter-dist
          path: dist/*

  publish-nemo-jupyter:
    name: Publish nemo-jupyter to PyPI
    needs: build-nemo-jupyter
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download nemo-jupyter artifacts
        uses: actions/download-artifact@v4
        with:
          name: nemo-jupyter-dist
          path: dist

      - name: Publish nemo-jupyter to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
